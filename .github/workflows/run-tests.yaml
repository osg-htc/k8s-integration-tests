name: Run K8s Integration Tests
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # runs every day at midnight UTC
jobs:
  ospool-ep:
    if: github.event_name != 'schedule' || github.repository_owner == 'osg-htc'
    uses: ./.github/workflows/test-ospool-ep.yaml

  pelican:
    if: github.event_name != 'schedule' || github.repository_owner == 'osg-htc'
    uses: ./.github/workflows/test-pelican.yaml
    secrets: inherit

  adstash:
    if: github.event_name != 'schedule' || github.repository_owner == 'osg-htc'
    uses: ./.github/workflows/test-adstash.yaml

  notify:
    needs: [ospool-ep, pelican, adstash]
    if: always() && (github.event_name != 'schedule' || github.repository_owner == 'osg-htc')
    runs-on: ubuntu-latest
    steps:
      - name: Send email summary
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.EMAIL_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"runID\": ${{ github.run_id }}}" \
            "https://${{ vars.RESULTS_DOMAIN }}/webhook/email-summary"
