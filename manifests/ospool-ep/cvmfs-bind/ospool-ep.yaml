apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ospool-ep
    name: ospool-ep
  name: ospool-ep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ospool-ep
  template:
    metadata:
      labels:
        app: ospool-ep
    spec:
      containers:
      - env:
        - name: GLIDEIN_ResourceName
          value: CHTC-DEV-EP-mwestphall
        - name: GLIDEIN_Site
          value: CHTC
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: pool-token
        - name: CONDOR_HOST
          value: test-cm
        - name: GLIDEIN_Start_Extra
          value: 'True'
        - name: OSG_SQUID_LOCATION
          value: 'None'
        - name: OSG_SQUID_LOCATION
          value: 'None'
        - name: ENABLE_REMOTE_SYSLOG
          value: 'False'
        # These overwrite the default values to run startd crons more frequently
        # This is needed to complete tests in a timely manner
        - name: _CONDOR_STARTD_CRON_base_PERIOD
          value: 1m
        - name: _CONDOR_STARTD_CRON_userenv_PERIOD
          value: 1m
        - name: OSG_DEFAULT_CONTAINER_DISTRIBUTION
          value: 100%__htc/minimal:0
        - name: OSG_DEFAULT_CONTAINER_DISTRIBUTION_GPU
          value: 100%__htc/minimal:0
        image: hub.osg-htc.org/osg-htc/ospool-ep:{{ .OSPoolEPTag }}
        imagePullPolicy: Always
        name: ospool-ep
        securityContext:
          privileged: true
          runAsGroup: 1000
          runAsUser: 1000
{{- if .ApparmorProfile }}
          appArmorProfile:
            type: Localhost
            localhostProfile: {{ .ApparmorProfile }}
{{- end }}
        volumeMounts:
        - mountPath: /pilot
          name: scratch
        - name: cvmfs-base
          mountPath: /cvmfs
          mountPropagation: HostToContainer
      initContainers:
      - command:
        - chown
        - -R
        - 1000:1000
        - /pilot
        image: hub.osg-htc.org/library/alpine:3
        name: chown-pilot-dir
        volumeMounts:
        - mountPath: /pilot
          name: scratch
      # The EP checks Singularity+CVMFS support once at startup and caches a
      # failure, so wait until CVMFS is mounted before starting the EP.
      - command:
        - sh
        - -c
        - |
          for i in $(seq 1 150); do
            ls /cvmfs/singularity.opensciencegrid.org/htc/rocky:9 >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Timed out waiting for CVMFS to be mounted" >&2
          exit 1
        image: hub.osg-htc.org/library/alpine:3
        name: wait-for-cvmfs
        volumeMounts:
        - name: cvmfs-base
          mountPath: /cvmfs
          mountPropagation: HostToContainer
      volumes:
      - name: cvmfs-base
        hostPath:
          path: /var/lib/cvmfs-k8s
      - emptyDir:
          sizeLimit: 5Gi
        name: scratch
