services:
  webapp:
    image: hub.osg-htc.org/osgpreview/k8s-integration-tests-viewer:latest
    build:
      context: .
      dockerfile: webapp.Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    environment:
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app-private-key
      GITHUB_OWNER: ${GITHUB_OWNER}
      GITHUB_REPO: ${GITHUB_REPO}
      PORT: "8080"
    volumes:
      - artifact-cache:/tmp/k8s-webapp-cache
      - ${GITHUB_APP_PRIVATE_KEY_PATH}:/run/secrets/github-app-private-key:ro

volumes:
  artifact-cache:
